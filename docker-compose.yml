services:
  opc-micro:
    image: mcr.microsoft.com/iotedge/opc-plc:2.15.16
    container_name: "opc-micro"
    command: --nodesfile /home/nodesfile.json --pn=50000  --autoaccept --unsecuretransport  --sph --sn=8 --sr=10 --st=uint --fn=8 --fr=1 --ft=double
    volumes:
      - ./opc-micro/nodesfile.json:/home/nodesfile.json
    ports:
      - "50000:50000"
      - "8085:8080"
    networks:
      - imh_net
  timescaledb:
    image: timescale/timescaledb:2.32.1-pg18
    container_name: "timescaledb"
    ports:
      - 2002:5432
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=p4ssw0rd
      - POSTGRES_DB=in4pl
      - DATA_TABLE=boiler
      - GRAFANA_DATA_DDBB=boiler
      - GRAFANA_DATA_USER=grafanareader
      - GRAFANA_DATA_PASSSWORD=password2022
      - GRAFANA_DDBB=grafana
      - GRAFANA_DDBB_USER=grafanaUser
      - GRAFANA_DDBB_PASSWORD=grafanaPass2022
    volumes:
      - ./postgres/initdb001.sh:/docker-entrypoint-initdb.d/init001.sh
      - ./postgres/initdb002.sh:/docker-entrypoint-initdb.d/init002.sh
      # PostgreSQL 18+ images keep PGDATA under /var/lib/postgresql/<major>/docker
      - timescale-data-pg18:/var/lib/postgresql

    networks:
      - imh_net
  pgadmindb:
    container_name: pgadmin4db
    image: dpage/pgadmin4:9.19.0
    ports:
      - "5051:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: password
    volumes:
      - ./postgres/servers.json:/pgadmin4/servers.json # preconfigured servers/connections
      - ./postgres/pgpass:/pgpass # passwords for the connections in this file
    networks:
      - imh_net
  grafana:
    image: grafana/grafana-oss:13.0.2
    container_name: monitoring_grafana
    volumes:
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini
      - ./grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml
      - grafana-storage:/var/lib/grafana
    ports:
      - 3000:3000
    environment:
      - GRAFANA_DATA_HOST=timescaledb:5432
      - GRAFANA_DATA_DDBB=in4pl
      - GRAFANA_DATA_USER=grafanareader
      - GRAFANA_DATA_PASSSWORD=password2022
      - GRAFANA_DDBB_HOST=timescaledb:5432
      - GRAFANA_DDBB=grafana
      - GRAFANA_DDBB_USER=grafanauser
      - GRAFANA_DDBB_PASSWORD=grafanaPass2022
      - GF_SECURITY_ADMIN_PASSWORD=MYPASSWORT
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_PLUGINS_PLUGIN_ADMIN_ENABLED=true
      # Bundled plugins (e.g. elasticsearch) are not writable by the grafana user in the 13.x image,
      # so auto-updating them fails at startup; keep the bundled versions instead.
      - GF_PLUGINS_PREINSTALL_AUTO_UPDATE=false
      - GF_SKIP_VERIFY=true
    restart: unless-stopped
    depends_on:
      - timescaledb
    networks:
      - imh_net
  node-red:
    image: nodered/node-red:5.0.10
    environment:
      - TZ=Europe/Madrid
    ports:
      - "1880:1880"
      - "53880:53880"
    networks:
      - imh_net
    volumes:
      - ./node-red-data:/data
  mqtt:
    image: eclipse-mosquitto:2.1.4-alpine
    hostname: mqtt
    container_name: mqtt
    ports:
      - 1883:1883
      - 9002:9001
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./mosquitto/p.txt:/mosquitto/config/mosquitto.passwd
    networks:
      - imh_net
  mqtt-web:
    # MQTTX Web: browser MQTT client, open http://localhost:8086
    # The client runs in the browser, so it reaches Mosquitto over WebSockets on the
    # host-published port (MQTT_WS_PORT, 9002 -> mqtt:9001), not via the Docker network.
    image: emqx/mqttx-web:v1.13.3
    container_name: mqtt-web
    environment:
      - MQTT_WS_PORT=9002
      - MQTT_USERNAME=imh-client
    # MQTTX Web has its defaults compiled in (broker.emqx.io:8083). Patch them on start so
    # "New Connection" is prefilled with this stack's broker: ws://<page host>:9002/mqtt.
    entrypoint: ["sh", "-c"]
    command:
      - |
        cd /app
        [ -f app.js.orig ] || cp app.js app.js.orig
        sed -e 's/(_a = \\"broker.emqx.io\\")/(_a = window.location.hostname)/' \
            -e "s/? 8084 : 8083,/? 8084 : $${MQTT_WS_PORT},/" \
            -e "s/name: '',\\\\n    clean: true/name: 'imh-mosquitto',\\\\n    clean: true/" \
            -e "s/username: '',\\\\n    password: '',\\\\n    path: '\\/mqtt'/username: '$${MQTT_USERNAME}',\\\\n    password: '',\\\\n    path: '\\/mqtt'/" \
            app.js.orig > app.js
        exec http-server -p 80 -c-1
    ports:
      - "8086:80"
    depends_on:
      - mqtt
    restart: unless-stopped
    networks:
      - imh_net
  opcua-client:
    # OPC UA explorer (UaExpert-like: address-space tree, attributes, references,
    # subscriptions, live graph, method calls) shown in the browser: http://localhost:5800
    # FreeOpcUa opcua-client running inside the container; it reaches the OPC server over
    # the Docker network, so the endpoint is opc-micro:50000 (preselected in the address box).
    build: ./opcua-client
    image: imh/opcua-client:1.0.2
    container_name: opcua-client
    environment:
      - OPCUA_DEFAULT_ENDPOINT=opc.tcp://opc-micro:50000
      - TZ=Europe/Madrid
      - DISPLAY_WIDTH=1600
      - DISPLAY_HEIGHT=900
      - KEEP_APP_RUNNING=1
    ports:
      - "5800:5800"
    depends_on:
      - opc-micro
    restart: unless-stopped
    networks:
      - imh_net
networks:
  imh_net:
volumes:
  grafana-storage:
  timescale-data-pg18:
