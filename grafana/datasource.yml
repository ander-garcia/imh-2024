# config file version
apiVersion: 1

# list of datasources that should be deleted from the database
deleteDatasources:
  - name: TimeScale
    orgId: 1

# list of datasources to insert/update depending
# what's available in the database
datasources:
  - name: TimeScale
    uid: timescale # fixed uid, referenced by the provisioned dashboards in grafana/dashboards/
    type: postgres
    orgId: 1
    url: $GRAFANA_DATA_HOST
    user: $GRAFANA_DATA_USER
    secureJsonData:
      password: $GRAFANA_DATA_PASSSWORD
    jsonData:
      # Current Grafana reads the database name from jsonData (the old top-level "database"
      # field makes every panel fail with "You do not currently have a default database configured")
      database: $GRAFANA_DATA_DDBB
      sslmode: "disable" # disable/require/verify-ca/verify-full
      maxOpenConns: 100 # must be >= 1 since Grafana 12 (0 = "unlimited" is no longer accepted)
      maxIdleConns: 2 # Grafana v5.4+
      connMaxLifetime: 14400 # Grafana v5.4+
      postgresVersion: 1500 # 1500 = PostgreSQL 15+
      timescaledb: true
    version: 1
    editable: true
